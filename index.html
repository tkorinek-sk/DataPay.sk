<!DOCTYPE html>
<html lang="sk">
<head>

<title>DataPay s.r.o.</title>

<style>
body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background:#f5f8fc;
    color:#1f2937;
}

header{
    background:#052c64;
    color:white;
    padding:20px 0;
}

.container{
    width:90%;
    max-width:1200px;
    margin:auto;
}

.nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo img{
    height:60px;
}

.hero{
    padding:80px 0;
}

.hero-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:40px;
    align-items:center;
}

.hero h1{
    font-size:60px;
    line-height:1.1;
    margin-bottom:20px;
    color:#052c64;
}

.hero p{
    font-size:20px;
    color:#4b5563;
}

.hero img{
    width:100%;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,0.15);
}

.btn{
    display:inline-block;
    background:#0d6efd;
    color:white;
    padding:14px 24px;
    border-radius:30px;
    text-decoration:none;
    margin-top:25px;
}

@media(max-width:900px){
    .hero-grid{
        grid-template-columns:1fr;
    }

    .hero h1{
        font-size:42px;
    }
}
</style>
</head>

<body>

<header>

<div class="container hero-grid">

</p>

</body>
</html>
