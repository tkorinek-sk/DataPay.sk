<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kontaktujte nás | DataPay</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
    background:#f4f8fc;
    color:#333;
    line-height:1.6;
}

.container{
    width:90%;
    max-width:900px;
    margin:auto;
}

header{
    background:linear-gradient(135deg,#052c64,#0d6efd);
    color:white;
    padding:20px 0;
    text-align:center;
}

header h1{
    font-size:42px;
    margin-bottom:15px;
}

header p{
    font-size:18px;
    opacity:0.9;
}

.form-section{
    margin-top:-40px;
    padding-bottom:80px;
}

.form-card{
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 40px rgba(0,0,0,0.1);
}

.form-card h2{
    color:#052c64;
    margin-bottom:10px;
}

.form-card p{
    margin-bottom:30px;
    color:#666;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
}

input,
textarea{
    width:100%;
    padding:14px;
    border:1px solid #d9d9d9;
    border-radius:10px;
    font-size:16px;
    transition:0.3s;
}

input:focus,
textarea:focus{
    outline:none;
    border-color:#0d6efd;
    box-shadow:0 0 0 3px rgba(13,110,253,0.15);
}

textarea{
    min-height:160px;
    resize:vertical;
}

.btn{
    background:#0d6efd;
    color:white;
    border:none;
    padding:15px 30px;
    font-size:16px;
    font-weight:bold;
    border-radius:30px;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    background:#094db1;
    transform:translateY(-2px);
}

.info-box{
    margin-top:30px;
    background:#eef5ff;
    padding:20px;
    border-radius:12px;
    color:#052c64;
}

.back-link{
    display:inline-block;
    margin-top:25px;
    color:#0d6efd;
    text-decoration:none;
    font-weight:bold;
}

.back-link:hover{
    text-decoration:underline;
}
    
.back-link {
    display: inline-block;
    color: #0d6efd;
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    transition: 0.3s;
}

.back-link:hover {
    color: #052c64;
    text-decoration: underline;
}

@media(max-width:768px){

    header h1{
        font-size:32px;
    }

    .form-card{
        padding:25px;
    }
}
</style>

</head>
<body>

<header>
    <div class="container">
        <h1>Kontaktujte nás</h1>
        <p>Máte záujem o naše služby alebo iné otázky? Napíšte nám.</p>
    </div>
</header>

<section class="form-section">
    <div class="container">

        <div class="form-card">

            <h2>Odpovieme Vám čo najskôr.</h2>

           <form action="https://formsubmit.co/datapaysk@gmail.com" method="POST">

    <input type="hidden" name="_subject" value="Nový dopyt z webu DataPay">
    <input type="hidden" name="_captcha" value="false">

    <div class="form-group">
        <label>Meno a priezvisko</label>
        <input type="text" name="Meno" required>
    </div>

    <div class="form-group">
        <label>Spoločnosť</label>
        <input type="text" name="Spolocnost">
    </div>

    <div class="form-group">
        <label>E-mail</label>
        <input type="email" name="Email" required>
    </div>

    <div class="form-group">
        <label>Telefón</label>
        <input type="tel" name="Telefon">
    </div>

    <div class="form-group">
        <label>Vaša správa</label>
        <textarea name="Sprava" rows="5" required></textarea>
    </div>

    <button class="btn" type="submit">
        Odoslať správu
    </button>

</form>
            <div style="text-align:center;">
    <a href="index.html" class="back-link">
        ← Späť na hlavnú stránku
    </a>
</div>

        </div>

    </div>
 
</section>
